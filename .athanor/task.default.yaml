# yaml-language-server: $schema=https://www.schemastore.org/any.json
forbiddenPaths: ["package-lock.json", "package.json"]

gates:
  - name: format
    command: "npm run format:check"
  - name: lint
    command: "npm run lint"
  - name: typecheck
    command: "npm run typecheck"
  - name: test
    command: "npm test -- --passWithNoTests"

# e2e gates cost real tokens (per AGENTS.md) and must be opt-in per task
# rather than running on every gate evaluation. Tasks that genuinely need
# e2e coverage can add a gate explicitly in their task spec.

maxAgentAttempts: 2
model: sonnet
