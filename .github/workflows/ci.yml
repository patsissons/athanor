name: CI

on:
  pull_request:
  # Lets a maintainer re-run CI by hand from the Actions tab without
  # opening a fresh PR.
  workflow_dispatch:

# Cancel an in-flight run when a newer commit lands on the same branch.
# Saves runner minutes and avoids stale "queued" PR checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Hardened default: this workflow only reads the repo. If a future job
# needs to comment on a PR or publish artefacts, opt in at the job level.
permissions:
  contents: read

jobs:
  ci:
    name: validate + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate (format, typecheck, lint, test)
        run: npm run validate

      - name: Build
        run: npm run build
